name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/anytls-install_server.sh
          go test -count=1 ./...
          go vet ./...
